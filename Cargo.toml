[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Audio processing is too slow unoptimized; keep dependencies fast even in dev builds.
[profile.dev.package."*"]
opt-level = 2
