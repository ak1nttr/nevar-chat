[package]
name = "nevar-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
cpal = "0.18.2"
iroh = "1.4.1"
nnnoiseless = "0.5.2"
opus = "0.4.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sonora = "0.2.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }
